<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Depthward</title>
    <meta name="description" content="Depthward: a pixel-art hack-and-slash rendered live from 3D. Fast combat, a deep passive tree, loot, endless procedural depths, a Spore-style creature Workshop, and AI agent tools built into the engine." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' rx='3' fill='%230d0c11'/><path fill='%23e8eef6' d='M12 2h2v2h-1v1h-1v1h-1v1h-1v1h-1v1H8v1H7V9h1V8h1V7h1V6h1V5h1V4h-1V3h1z'/><path fill='%23ffcf5a' d='M4 9h2v1h1v1h1v1H7v1H6v-1H5v-1H4z'/><path fill='%236a4a2a' d='M3 12h2v2H3z'/></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c11; }
      #view { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      #hud {
        position: fixed; z-index: 5; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); margin: 0; padding: 6px 8px;
        font: 12px/1.35 ui-monospace, Consolas, monospace; color: #e9e3d2;
        background: rgba(10, 9, 14, 0.72); white-space: pre-wrap; max-width: calc(100vw - 32px); pointer-events: none;
      }
      #hud:empty { display: none; }
      body { overscroll-behavior: none; }
      button { color: #fff4db; background: #242334e6; border: 1px solid #a9a1b9; border-radius: 12px; font: bold 13px system-ui; min-height: 44px; padding: 8px 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
      button:active { background: #696080; }
      #toolbar { position: fixed; z-index: 15; top: calc(max(8px, env(safe-area-inset-top)) + 90px); right: max(8px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 5px; }
      #toolbar[hidden] { display: none; }
      #toolbar button { min-width: 44px; min-height: 38px; padding: 4px 8px; font-size: 12px; }
      #toolbar #settings-open { font-size: 18px; padding: 2px 8px; }
      #loading { position: fixed; inset: 40% 20px auto; color: #fff4db; text-align: center; font: 16px system-ui; }
      .agent-mode #toolbar, .agent-mode #touch, .agent-mode #mapbtn { display: none; }
      #mapbtn { position: fixed; z-index: 14; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; }
      #mapbtn[hidden] { display: none; }
      #mapbtn:focus-visible { outline: 3px solid #ffcf5a; outline-offset: 2px; }
      @media (max-height: 450px) { #hud { font-size: 10px; max-width: 48vw; } }
      @media (max-width: 380px) { #toolbar button { padding: 4px 6px; font-size: 11px; min-width: 40px; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="hud"></pre>
    <div id="loading" role="status">Loading engine, models and animations…</div>
    <nav id="toolbar" aria-label="Game menus"><button id="menu-open" aria-label="Pause menu" title="Pause menu (Esc)">☰</button><button id="bag" title="Inventory (I)">Bag</button><button id="treebtn" title="Passive tree (P)">Tree</button><button id="charbtn" title="Character and skills (C)">Char</button><button id="mode" title="Pixel art / plain 3D (F2)">3D</button><button id="settings-open" aria-label="Settings" aria-haspopup="dialog" title="Settings">⚙</button></nav>
    <button id="mapbtn" hidden aria-label="Map" title="Map (Tab)"></button>
    <div id="touch" role="group" aria-label="Game controls" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="gtoast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
