<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3dpixel2d</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c11; }
      #view { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      #hud {
        position: fixed; left: 8px; top: 8px; margin: 0; padding: 6px 8px;
        font: 12px/1.35 ui-monospace, Consolas, monospace; color: #e9e3d2;
        background: rgba(10, 9, 14, 0.72); white-space: pre-wrap; max-width: calc(100vw - 32px); pointer-events: none;
      }
      #hud:empty { display: none; }
      body { overscroll-behavior: none; }
      button { color: #fff4db; background: #242334e6; border: 1px solid #a9a1b9; border-radius: 12px; font: bold 13px system-ui; min-height: 44px; padding: 8px 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
      button:active { background: #696080; }
      #toolbar { position: fixed; top: max(88px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: flex; gap: 6px; }
      #touch { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: end; pointer-events: none; }
      #touch button { pointer-events: auto; }
      #pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 3px; }
      #pad button { padding: 0; font-size: 20px; }
      #actions { display: grid; gap: 8px; }
      #loading { position: fixed; inset: 40% 20px auto; color: #fff4db; text-align: center; font: 16px system-ui; }
      .agent-mode #toolbar, .agent-mode #touch { display: none; }
      @media (pointer: fine) and (min-width: 900px) { #touch { display: none; } }
      @media (max-height: 450px) { #toolbar { top: max(8px, env(safe-area-inset-top)); } #hud { font-size: 10px; max-width: 48vw; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="hud"></pre>
    <div id="loading" role="status">Loading engine, models and animations…</div>
    <nav id="toolbar" aria-label="Engine controls"><button id="mode">Pixel / 3D</button><button id="pause">Pause</button><button id="reset">Reset</button></nav>
    <div id="touch" aria-label="Game controls">
      <div id="pad"><span></span><button data-key="ArrowUp" aria-label="Move up">▲</button><span></span><button data-key="ArrowLeft" aria-label="Move left">◀</button><span></span><button data-key="ArrowRight" aria-label="Move right">▶</button><span></span><button data-key="ArrowDown" aria-label="Move down">▼</button></div>
      <div id="actions"><button data-key="ShiftLeft">Sprint</button><button data-key="Space">Jump</button><button data-key="KeyJ">Attack</button></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
